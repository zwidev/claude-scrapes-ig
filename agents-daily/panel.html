<!doctype html><html><head><meta charset="utf-8"><style>
/* Agent spotlight panel (banner + card), 1080x960. Data from agent.json via window.DATA; frames via window.render(t).
   0–2.5s the problem (hook), 2.5–5s the agent card, 5s+ what it does, price and where to find it. */
@font-face{font-family:M8;src:url(mont800.woff)}
html,body{margin:0;width:1080px;height:960px;background:#07090b;overflow:hidden;font-family:"DejaVu Sans",Arial,sans-serif;color:#e8ecef;position:relative}
.ban{height:80px;background:#000;display:flex;align-items:center;justify-content:center;font-family:M8;font-size:54px;color:#fff;white-space:nowrap}
.wrap{position:absolute;top:80px;left:0;width:1080px;height:880px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 40px 4px}
.brand{font-weight:bold;font-size:34px}.brand span{color:#2ee6a6}.tag{color:#2ee6a6;font-weight:bold;font-size:24px;border:2px solid #2ee6a6;border-radius:999px;padding:4px 16px}
.hook{position:absolute;left:60px;right:60px;top:150px;text-align:center}
.hook small{display:block;color:#8a949c;font-size:26px;letter-spacing:3px;margin-bottom:22px}
.hook div{font-family:M8;font-size:54px;line-height:1.18;color:#fff;min-height:200px}
.card{position:absolute;left:40px;right:40px;top:96px;padding:26px 32px;border:2px solid #1f252b;border-radius:22px;background:#0e1215;opacity:0}
.chips{display:flex;gap:12px;align-items:center}
.num{font-family:"DejaVu Sans Mono",monospace;font-weight:bold;font-size:24px;background:#10343a;color:#7fe3f0;padding:5px 14px;border-radius:8px}
.cat{font-size:22px;color:#8a949c}.ok{margin-left:auto;font-size:22px;font-weight:bold;color:#2ee6a6}
.nm{font-family:M8;font-size:62px;margin:14px 0 6px;color:#fff;line-height:1.05}
.tl{font-size:28px;color:#c9d1d6;line-height:1.3}
.bul{position:absolute;left:40px;right:40px;top:380px}
.who{position:absolute;left:60px;right:60px;top:420px;text-align:center;font-family:M8;font-size:44px;line-height:1.2;color:#fff;opacity:0}
.b{font-size:31px;margin:0 0 18px;padding-left:52px;position:relative;opacity:0;line-height:1.25}
.b:before{content:"✓";position:absolute;left:4px;top:-2px;color:#2ee6a6;font-weight:bold;font-size:36px}
.price{position:absolute;left:40px;right:40px;top:566px;display:flex;gap:18px;align-items:center;opacity:0}
.pp{font-family:M8;font-size:44px;color:#ffd866}.dp{font-size:24px;color:#8a949c}
.cta{position:absolute;left:40px;right:40px;top:636px;padding:18px;border-radius:18px;background:#06291e;border:3px solid #2ee6a6;text-align:center;opacity:0}
.cta b{font-size:34px;color:#2ee6a6}.cta span{display:block;font-size:21px;color:#d6fff0;margin-top:6px}
.risk{position:absolute;bottom:48px;left:30px;right:30px;padding:8px 16px;border:1px solid #3a3f44;border-radius:10px;color:#b9c0c6;font-size:18px;line-height:1.3;text-align:center;background:#0b0d0f}
.foot{position:absolute;bottom:14px;width:100%;text-align:center;color:#59636b;font-size:18px}
</style></head><body>
<div class="ban" id="ban"></div>
<div class="wrap">
<div class="top"><div class="brand">ZenCore <span>Marketplace</span></div><div class="tag">AGENT OF THE DAY</div></div>
<div class="hook" id="hook"><small>SOUND FAMILIAR?</small><div id="hk"></div></div>
<div class="card" id="card"><div class="chips"><span class="num" id="num"></span><span class="cat" id="cat"></span><span class="ok">● Available</span></div>
<div class="nm" id="nm"></div><div class="tl" id="tl"></div></div>
<div class="who" id="who"></div>
<div class="bul" id="bul"></div>
<div class="price" id="price"><span class="pp" id="pp"></span><span class="dp" id="dp"></span></div>
<div class="cta" id="cta"><b>zencore.solutions</b><span id="ctas"></span></div>
<div class="risk" id="risk"></div>
<div class="foot" id="foot"></div>
</div>
<script>
const D=window.DATA, $=id=>document.getElementById(id);
const ban=$('ban');ban.textContent=`AGENT ${D.num} · ${D.name.toUpperCase()} — LINK IN BIO`;
for(let s=54;s>30&&ban.scrollWidth>1040;s-=2)ban.style.fontSize=s+'px';
$('num').textContent='AGENT '+D.num;$('cat').textContent=D.category;$('nm').textContent=D.name;$('tl').textContent=D.tagline;
D.bullets.forEach((t,i)=>$('bul').insertAdjacentHTML('beforeend',`<div class="b" id="b${i}">${t}</div>`));
$('pp').textContent=D.price;$('dp').textContent=D.deploy;
$('ctas').textContent=`Marketplace → Agent ${D.num} · 14-day money-back guarantee`;
const d=new Date(D.date+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
$('who').textContent=D.who;
const R=$('risk');if(D.disclaimer)R.textContent=D.disclaimer;else R.style.display='none';
$('foot').textContent=`Price and details from zencore.solutions, ${d}`;
const C=x=>Math.max(0,Math.min(1,x)), E=x=>1-Math.pow(1-C(x),3);
function render(t){
 // hook types in over 2.2s, then lifts away as the card arrives
 const n=Math.round(D.hook.length*C(t/2.0));$('hk').textContent=D.hook.slice(0,n)+(t<2.3&&Math.floor(t*3)%2==0?'▍':'');
 const h=E((t-2.5)/0.4);$('hook').style.opacity=1-h;$('hook').style.transform=`translateY(${-60*h}px)`;
 const c=E((t-2.6)/0.45);$('card').style.opacity=c;$('card').style.transform=`translateY(${40*(1-c)}px)`;
 $('card').style.borderColor=t>=2.6&&t<5&&Math.floor(t*4)%2==0?'#2ee6a6':'#1f252b';
 const w=E((t-3.0)/0.4)*(1-E((t-4.8)/0.25));$('who').style.opacity=w;
 D.bullets.forEach((_,i)=>{const k=E((t-5-0.4*i)/0.3);const b=$('b'+i);b.style.opacity=k;b.style.transform=`translateX(${-30*(1-k)}px)`;});
 const p=E((t-6.2)/0.3);$('price').style.opacity=p;
 const q=E((t-6.6)/0.35);const a=$('cta');a.style.opacity=q;a.style.transform=`scale(${0.85+0.15*q})`;
 const g=t>7?0.55+0.35*Math.abs(Math.sin((t-7)*Math.PI/0.6)):0.55;a.style.boxShadow=`0 0 ${50+80*(g-0.55)}px rgba(46,230,166,${g})`;}
window.render=render;
</script></body></html>
